name: Crear APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - name: Renombrar
        run: cp app/build/outputs/apk/debug/app-debug.apk InglesFacil.apk

      - uses: actions/upload-artifact@v4
        with:
          name: InglesFacil-apk
          path: InglesFacil.apk
